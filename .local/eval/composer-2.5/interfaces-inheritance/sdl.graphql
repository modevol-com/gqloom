"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTimeISO

type Employee implements IPerson {
  age: Int!
  avatar(size: Float!): String!
  companyName: String!

  """Unique identifier"""
  id: String!
  name: String!
}

input EmployeeInput {
  companyName: String!
  dateOfBirth: DateTimeISO!
  name: String!
}

"""A person in the registry"""
interface IPerson implements IResource {
  age: Int!

  """Unique identifier"""
  id: String!
  name: String!
}

interface IResource {
  """Resource identifier"""
  id: String!
}

type Mutation {
  addEmployee(input: EmployeeInput!): Employee!
  addStudent(input: StudentInput!): Student!
}

type Person implements IPerson {
  age: Int!
  avatar(size: Float!): String!

  """Unique identifier"""
  id: String!
  name: String!
}

union Persons = Employee | Student

type Query {
  persons: [Persons!]!
}

type Student implements IPerson {
  age: Int!
  avatar(size: Float!): String!

  """Unique identifier"""
  id: String!
  name: String!
  universityName: String!
}

input StudentInput {
  dateOfBirth: DateTimeISO!
  name: String!
  universityName: String!
}
